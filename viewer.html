<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DraganScroll PDF viewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <strong>DraganScroll PDF viewer</strong>
      <input id="file" type="file" accept="application/pdf,.pdf" />
      <button id="plan" disabled>Generate checkpoints</button>
      <button id="vision" disabled>Generate scanned-page checkpoints with Gemma</button>
      <button id="reset" type="button">Reset Gemma session</button>
      <div id="text-model-progress" class="model-progress" aria-live="polite">
        <span id="text-model-progress-label">Text model: starting</span>
        <progress id="text-model-progress-bar" max="1" value="0"></progress>
      </div>
      <div id="image-model-progress" class="model-progress" aria-live="polite">
        <span id="image-model-progress-label">Image model: starting</span>
        <progress id="image-model-progress-bar" max="1" value="0"></progress>
      </div>
      <span id="status" role="status">Choose a PDF to begin.</span>
    </header>
    <main id="pages"></main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
