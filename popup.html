<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DraganScroll</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        min-width: 260px;
      }
      p {
        margin: 0.5rem 0;
      }
      code {
        background: #f3f4f6;
        padding: 2px 4px;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: #0369a1;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #vision {
        margin-top: 8px;
        background: #475569;
      }
      #status {
        color: #334155;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 16px; margin: 0">DraganScroll</h1>
    <p>Gemma 4 plans checkpoint locations at significant reading boundaries.</p>
    <p>Placeholders are added first; questions are generated in a later step.</p>
    <button id="plan">Plan checkpoints for this tab</button>
    <button id="vision">Plan from the visible page with Gemma</button>
    <p id="status" role="status"></p>
    <div id="results"></div>
    <script src="popup.js"></script>
  </body>
</html>
